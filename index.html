<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Club Soda</title>
  <link rel="icon" type="image/png" href="favicon.png" />

  <style>
    :root {
      --bg: #f6f7f4;
      --text: #1e2a36;
      --muted: #5f6f82;
      --accent: #3a6ea5;
      --border: #d8dee6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 4rem 1.5rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 2rem;
    }

    .mission {
      font-size: 1.1rem;
      margin-bottom: 3rem;
    }

    .projects {
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
      margin-top: 2rem;
    }

    .projects-heading {
      font-weight: 600;
      color: var(--accent);
    }

    .project {
      margin-top: 1.5rem;
      padding: 1rem;
      border: 1px solid var(--border);
      background: white;
    }

    .project-title {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    footer {
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--muted);
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <main>
    <h1>Club Soda</h1>

    <p class="mission">
      Club Soda makes tools and games.
      We create video games, tabletop experiences, and interactive works that invite curiosity,
      care, and craft. 
    </p>

    <section class="projects">
      <div class="projects-heading">Projects</div>

      <div class="project">
        <div class="project-title">Secret Union</div>
        <div>Release Date: November 16th, 2026</div>
        <div><a href="SU_export_3.pdf" download>Download Secret Union</a> or <a href="https://chalers.itch.io/secret-union" target="_blank" rel="noopener noreferrer">download from itch</a></div>
      </div>
    </section>

    <footer>
      <p>
        Find us on <a href="https://itch.io" target="_blank" rel="noopener noreferrer">itch.io</a>
      </p>
    </footer>
  </main>
</body>
</html>
